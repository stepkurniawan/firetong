services:
  firetong:
    image: ${FIRETONG_IMAGE:-stepkurniawan/firetong:latest}
    pull_policy: always
    ports:
      - "${FIRETONG_PORT:-8000}:8000"
    environment:
      FIRETONG_OPENAI_BASE_URL: ${FIRETONG_OPENAI_BASE_URL:-https://api.openai.com/v1}
      FIRETONG_OPENAI_API_KEY: ${FIRETONG_OPENAI_API_KEY:-}
      FIRETONG_TRANSCRIPTION_MODEL: ${FIRETONG_TRANSCRIPTION_MODEL:-gpt-realtime-whisper}
      FIRETONG_REALTIME_INPUT_LANGUAGE: ${FIRETONG_REALTIME_INPUT_LANGUAGE:-id}
      FIRETONG_REALTIME_TRANSLATION_MODEL: ${FIRETONG_REALTIME_TRANSLATION_MODEL:-gpt-realtime-translate}
      FIRETONG_REALTIME_TRANSLATION_LANGUAGE: ${FIRETONG_REALTIME_TRANSLATION_LANGUAGE:-en}
      FIRETONG_REALTIME_TRANSCRIPTION_DELAY: ${FIRETONG_REALTIME_TRANSCRIPTION_DELAY:-low}
      FIRETONG_TRANSCRIPT_SAVE_DIR: ${FIRETONG_TRANSCRIPT_SAVE_DIR:-saved-sessions}
      FIRETONG_FEEDBACK_EMAIL_TO: ${FIRETONG_FEEDBACK_EMAIL_TO:-stepkurniawan.learn@gmail.com}
      FIRETONG_FEEDBACK_EMAIL_FROM: ${FIRETONG_FEEDBACK_EMAIL_FROM:-}
      FIRETONG_FEEDBACK_SMTP_HOST: ${FIRETONG_FEEDBACK_SMTP_HOST:-}
      FIRETONG_FEEDBACK_SMTP_PORT: ${FIRETONG_FEEDBACK_SMTP_PORT:-587}
      FIRETONG_FEEDBACK_SMTP_USERNAME: ${FIRETONG_FEEDBACK_SMTP_USERNAME:-}
      FIRETONG_FEEDBACK_SMTP_PASSWORD: ${FIRETONG_FEEDBACK_SMTP_PASSWORD:-}
      FIRETONG_FEEDBACK_SMTP_STARTTLS: ${FIRETONG_FEEDBACK_SMTP_STARTTLS:-true}
      FIRETONG_FEEDBACK_SMTP_SSL: ${FIRETONG_FEEDBACK_SMTP_SSL:-false}
    volumes:
      - ${FIRETONG_TRANSCRIPT_HOST_DIR:-./saved-sessions}:/app/saved-sessions
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
