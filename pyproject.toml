[project]
name = "firetong"
version = "0.1.0"
description = "FireTong MVP: Indonesian sermon transcription and English translation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pre-commit>=4.0.0",
    "pytest>=8.2.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["backend"]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
